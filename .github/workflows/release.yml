name: release

# CI + image release for the Hollow Grid bot (the only bot in this repo).
#   - lint: syntax-check the bot on every push/PR.
#   - test: run the node:test suite with coverage; the job fails if line,
#     branch, or function coverage on bot.mjs drops below the thresholds
#     wired into `npm run test:coverage`.
#   - build + push: ONLY on a version tag (v*), build the image and push
#     to GHCR as :latest + :<tag>.
#
# The bot runs as a containerized Docker stack on its host; (re)deploy is done
# by updating the stack compose file and redeploying -- a separate deliberate
# step, not owned by CI.
#
# Runner: GitHub-hosted ubuntu-latest (public repo, fork-safe). GHCR auth uses the
# built-in GITHUB_TOKEN (no PAT) with packages: write scoped to the build job; the
# build+push job only runs on a version tag (forks cannot push tags), so no secret
# is ever exposed to a fork PR.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Lint bot (node --check)
        run: |
          node --check hollow-grid/bot.mjs
          node --check hollow-grid/bot.test.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test with coverage gate
        working-directory: hollow-grid
        run: npm run test:coverage

  build:
    # Build + push the image only on a version tag.
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      REG_HG: ghcr.io/skyphusion-labs/mud-bots-hg
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        run: |
          docker image prune -f || true
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build -t "$REG_HG:$TAG" -t "$REG_HG:latest" -f hollow-grid/Dockerfile hollow-grid/

      - name: Push image
        run: |
          docker push "$REG_HG:$TAG"
          docker push "$REG_HG:latest"

      - name: Clean up
        if: always()
        run: |
          docker image rm "$REG_HG:$TAG" "$REG_HG:latest" || true
          docker logout ghcr.io || true

  ci:
    name: ci
    needs: [lint, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and test
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
