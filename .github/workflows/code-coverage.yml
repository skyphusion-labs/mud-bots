name: Test and Native Code Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      
      code-quality: write    # Required for GitHub Enterprise Code Coverage API
      pull-requests: write   # Allows appending the widget inside the PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Provide a standard base execution environment
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # 2. Build tracking dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 3. Instrument the bot files using the local wrapper script
      - name: Run Bot Smoke Tests with Coverage
        run: pytest --cov=. --cov-report=xml:coverage.xml

      # 4. Upload raw telemetry schemas straight to your PR dashboard widget
      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: ./coverage.xml
          language: python
