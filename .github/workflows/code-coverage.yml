name: Test and Native Code Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Provide a standard base execution environment
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 2. Build tracking dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 3. Instrument the bot files using the local wrapper script
      - name: Run Bot Smoke Tests with Coverage
        run: pytest --cov=. --cov-report=xml:coverage.xml

      # 4. Publish the coverage report as a standard build artifact (fork-safe;
      #    the GitHub Enterprise code-coverage API does not exist on public github.com)
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn
