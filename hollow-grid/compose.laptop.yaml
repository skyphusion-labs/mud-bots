name: mud-bot-laptop

# Laptop external QA: the GHCR image, pointed at a world that is actually up.
#
# MUD_URL was wss://rustchoir.skyphusion.org/ws, the hollow-grid-go (Rust Choir) world on
# biafra. The Hetzner fleet was decommissioned 2026-09-24 and that hostname now has NO DNS
# record of any type, so the only outcome left was a connection timeout with nothing naming
# the cause. It points at hollow.skyphusion.org instead, which is what every other example
# in hollow-grid/README.md already uses; measured 2026-09-25, an HTTP/2 upgrade request to
# /ws answers 426 Upgrade Required (a live WebSocket handler) while rustchoir answers
# nothing at all. Re-point this if the Go port is ever deployed again.
# Gateway creds: ~/mud-bots-gateway.env (source from ~/.zshrc).
# Logs + bug JSONL: ./local/logs/ (agents tail local-scrape*.log / *-bugs.jsonl).
#
#   docker compose -f compose.laptop.yaml up
#   docker compose -f compose.laptop.yaml logs -f

services:
  local-scrape:
    image: ghcr.io/skyphusion-labs/mud-bots-hg:v1.2.2
    restart: "no"
    env_file:
      - ${MUD_BOTS_GATEWAY_ENV:-${HOME}/mud-bots-gateway.env}
    environment:
      BOT_BRAIN: gateway
      MUD_URL: wss://hollow.skyphusion.org/ws
      MUD_NAME: LocalScrape
      MUD_MODEL: workers-ai/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      BOT_MAX_TOKENS: "200"
      BOT_THINK_MS: "4000"
      BOT_LOG: /var/log/mudbot/local-scrape.log
    volumes:
      - ./local/logs:/var/log/mudbot
