# Wendy fleet stack: containerized ollama + HG bot trio.
#
# Ollama bind-mounts the host's existing model store
# (/usr/share/ollama/.ollama) so the 27B model is available immediately
# without a re-pull. After validating the stack, stop and disable the
# host-level ollama service:
#   sudo systemctl stop ollama && sudo systemctl disable ollama
#
# GPU passthrough requires the NVIDIA Container Toolkit on wendy.
# Secrets (none currently) stay in Portainer env; nothing sensitive is
# baked into this file.

services:
  ollama:
    # Pinned to the digest that ships cuda_v12 (supports V100S cc=7.0).
    # ollama/ollama:latest dropped V100 support when it moved to cuda_v13-only.
    image: ollama/ollama@sha256:46399ef084d97b381955b5dc585c5d836dbe7ed3f79f170d1c04660fed511e3a
    restart: unless-stopped
    volumes:
      - /usr/share/ollama/.ollama:/root/.ollama
    networks:
      - wendy-ai-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  wendybot:
    image: ghcr.io/skyphusion/mud-bots-hg:latest
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      MUD_URL: wss://hollow.skyphusion.org/ws
      MUD_NAME: wendybot
      MUD_MODEL: qwen3.6:27b
      BOT_MAX_TOKENS: "4000"
      BOT_THINK_MS: "4500"
      OLLAMA_BASE_URL: http://ollama:11434/v1
      BOT_LOG: /dev/stdout
    networks:
      - wendy-ai-net

  cinderbot:
    image: ghcr.io/skyphusion/mud-bots-hg:latest
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      MUD_URL: wss://hollow.skyphusion.org/ws
      MUD_NAME: cinderbot
      MUD_MODEL: qwen3.6:27b
      BOT_MAX_TOKENS: "4000"
      BOT_THINK_MS: "4500"
      OLLAMA_BASE_URL: http://ollama:11434/v1
      BOT_LOG: /dev/stdout
    networks:
      - wendy-ai-net

  dustbot:
    image: ghcr.io/skyphusion/mud-bots-hg:latest
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      MUD_URL: wss://hollow.skyphusion.org/ws
      MUD_NAME: dustbot
      MUD_MODEL: qwen3.6:27b
      BOT_MAX_TOKENS: "4000"
      BOT_THINK_MS: "4500"
      OLLAMA_BASE_URL: http://ollama:11434/v1
      BOT_LOG: /dev/stdout
    networks:
      - wendy-ai-net

networks:
  wendy-ai-net:
    driver: bridge
